# End-to-end tests against the hotel's ephemeral environment (Vercel preview) and, after a merge, against production.
name: E2E

on: deployment_status

permissions:
  contents: read

jobs:
  e2e:
    name: E2E on ${{ github.event.deployment.environment }}
    if: >-
      github.event.deployment_status.state == 'success' &&
      contains(github.event.deployment.environment, 'hotel')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter hotel exec playwright install --with-deps chromium
      - run: pnpm --filter hotel e2e
        env:
          E2E_BASE_URL: ${{ github.event.deployment_status.environment_url }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/hotel/playwright-report
          retention-days: 7
