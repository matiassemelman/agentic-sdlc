# Order a ticket: the factory's only entry. Admits the order, opens the run's issue with the ticket's
# fixed text and runs the spec station, which posts the spec for the product owner to approve.
name: Order a ticket

on:
  workflow_dispatch:
    inputs:
      ticket:
        description: Ticket
        type: choice
        options:
          - guest-filter
          - stay-total
          - usd-prices

permissions:
  contents: read
  issues: write

# Orders wait one behind another, so two can never pass admission together.
concurrency:
  group: factory-order
  cancel-in-progress: false

jobs:
  order:
    name: Admit, open the run, write the spec
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The API key lives in this environment, which only main can use.
    environment:
      name: factory
      deployment: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TICKET: ${{ inputs.ticket }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter stations

      - name: Admit the order
        run: |
          active=$(gh issue list --state open --search 'label:run -label:"station:maintainer"' --json number --jq '[.[].number]')
          since=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          recent=$(gh issue list --state all --label run --search "created:>=$since" --limit 100 --json number --jq length)
          if ! node packages/stations/src/run-order.ts --ticket "$TICKET" --active "$active" --recent "$recent" \
              --actor "$GITHUB_ACTOR" --run-url "$RUN_URL" --out out; then
            { echo "### Order refused"; cat out/refusal.md 2>/dev/null; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Open the run
        id: open
        run: |
          url=$(gh issue create --title "$(cat out/issue-title.txt)" --body-file out/issue.md \
            --label run --label "ticket:$TICKET" --label station:spec)
          echo "issue=${url##*/}" >> "$GITHUB_OUTPUT"
          echo "### Run [#${url##*/}]($url): $(cat out/issue-title.txt)" >> "$GITHUB_STEP_SUMMARY"

      - name: Spec station (Opus 5.5, one call)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ISSUE: ${{ steps.open.outputs.issue }}
        run: node packages/stations/src/run-spec.ts --ticket "$TICKET" --issue "$ISSUE" --out out

      - name: Post the spec for approval
        env:
          ISSUE: ${{ steps.open.outputs.issue }}
        run: |
          gh issue comment "$ISSUE" --body-file out/spec-comment.md
          gh issue edit "$ISSUE" --remove-label station:spec --add-label station:spec-approval

      - name: Close the run if the spec station failed
        if: failure() && steps.open.outputs.issue
        env:
          ISSUE: ${{ steps.open.outputs.issue }}
        run: |
          {
            echo "The spec station failed, so this run stops here."
            echo
            cat out/error.md 2>/dev/null || echo "See the workflow log."
            echo
            echo "[Workflow run]($RUN_URL)"
          } > out/failure.md
          gh issue comment "$ISSUE" --body-file out/failure.md
          gh issue edit "$ISSUE" --remove-label station:spec --add-label outcome:failed
          gh issue close "$ISSUE" --reason "not planned"

      - name: Keep the spec envelope (tokens, cost) for the run ledger
        if: always() && steps.open.outputs.issue
        uses: actions/upload-artifact@v4
        with:
          name: spec-${{ steps.open.outputs.issue }}
          path: out/envelope.json
          if-no-files-found: ignore
          retention-days: 90
