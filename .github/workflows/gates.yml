# Fast gates: the cheapest checks run first, on every pull request and on main.
name: Fast gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gates-${{ github.ref }}
  # A newer push to a pull request replaces its older run; every run on main finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fast-gates:
    name: Lint, types, unit, build, design
    runs-on: ubicloud-standard-2
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Design house rules (taste skill lint)
        run: node .claude/skills/design-taste-frontend/scripts/lint.mjs apps/hotel/app apps/hotel/components

  # The workflows only run from main (the factory environment), so a broken one would show only after
  # the merge: lint them here. And the repo is public: no private term may land in a file or a commit.
  repo-checks:
    name: Workflow lint, private terms
    runs-on: ubicloud-standard-2
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Workflow lint (actionlint, pinned and checksum-verified, as pnpm lint:workflows)
        run: scripts/actionlint.sh
      - name: Private terms (files, and the messages of the new commits)
        env:
          PRIVATE_TERMS: ${{ vars.PRIVATE_TERMS }}
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: scripts/check-private-terms.sh
